<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1600px;
    height: 800px;
    background: #080c14;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .bg-glow-1 {
    position: absolute;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.16) 0%, rgba(14, 165, 233, 0) 70%);
    top: -100px;
    left: -100px;
    filter: blur(60px);
  }
  .bg-glow-2 {
    position: absolute;
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.14) 0%, rgba(99, 102, 241, 0) 70%);
    bottom: -150px;
    right: 100px;
    filter: blur(80px);
  }
  .grid-pattern {
    position: absolute;
    inset: 0;
    background-image: linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at 60% 50%, black 50%, transparent 85%);
  }
  .container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    padding: 0 90px;
    position: relative;
    z-index: 10;
  }
  .left-col {
    flex: 0 0 620px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 30px;
  }
  .logo-img {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 35px rgba(14, 165, 233, 0.4);
  }
  .brand-title {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #ffffff;
  }
  h1 {
    font-size: 56px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.03em;
    color: #ffffff;
    margin-bottom: 22px;
  }
  h1 span.highlight {
    background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p.desc {
    font-size: 20px;
    line-height: 1.55;
    color: #94a3b8;
    margin-bottom: 36px;
    max-width: 560px;
  }
  .pills {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .pill {
    padding: 9px 20px;
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 100px;
    font-size: 14px;
    font-weight: 600;
    color: #cbd5e1;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  }
  .right-col {
    flex: 1;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
  }
  .mockup-group {
    position: relative;
    width: 780px;
    height: 640px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .phone-frame {
    position: absolute;
    width: 270px;
    height: 585px;
    border-radius: 40px;
    background: #0b0f19;
    border: 6px solid #1e293b;
    box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 40px rgba(14, 165, 233, 0.15);
    overflow: hidden;
    transition: transform 0.3s;
  }
  .phone-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .phone-left {
    transform: translateX(-190px) rotate(-7deg) scale(0.92);
    z-index: 2;
    opacity: 0.92;
  }
  .phone-center {
    transform: translateX(0) rotate(0deg) scale(1.04);
    z-index: 5;
    border-color: #334155;
    box-shadow: 0 35px 80px -20px rgba(0, 0, 0, 0.95), 0 0 50px rgba(14, 165, 233, 0.3);
  }
  .phone-right {
    transform: translateX(190px) rotate(7deg) scale(0.92);
    z-index: 3;
    opacity: 0.92;
  }
  .desktop-backdrop {
    position: absolute;
    width: 720px;
    height: 450px;
    border-radius: 20px;
    background: #0f172a;
    border: 4px solid #1e293b;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    overflow: hidden;
    transform: translateY(-40px) scale(0.95);
    opacity: 0.35;
    z-index: 1;
    filter: blur(1px);
  }
  .desktop-backdrop img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>
<div class="grid-pattern"></div>
<div class="container">
  <div class="left-col">
    <div class="logo-row">
      <img src="../public/avatar.png" class="logo-img" alt="Trujillo AI Logo">
      <span class="brand-title">Trujillo AI</span>
    </div>
    <h1>Tu inteligencia,<br><span class="highlight">en el perímetro.</span></h1>
    <p class="desc">Workspace empresarial y bot de Discord con inferencia Groq LPU (~500 tps), visión multimodal, memoria semántica en KV y gateway compatible con OpenAI.</p>
    <div class="pills">
      <div class="pill">⚡ Groq LPU</div>
      <div class="pill">🧠 GPT-OSS 120B</div>
      <div class="pill">👁️ Qwen 3.8 Vision</div>
      <div class="pill">☁️ Cloudflare</div>
      <div class="pill">🛡️ MIT</div>
    </div>
  </div>
  <div class="right-col">
    <div class="mockup-group">
      <div class="desktop-backdrop">
        <img src="screenshots/desktop-chat.png" alt="Desktop Workspace">
      </div>
      <div class="phone-frame phone-left">
        <img src="screenshots/mobile-features.png" alt="Trujillo AI Features">
      </div>
      <div class="phone-frame phone-center">
        <img src="screenshots/mobile-chat.png" alt="Trujillo AI Chat">
      </div>
      <div class="phone-frame phone-right">
        <img src="screenshots/mobile-models.png" alt="Trujillo AI Models">
      </div>
    </div>
  </div>
</div>
</body>
</html>
